<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<meta name="robots" content="noindex">
<title>Robbie</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root { --bg:#14161a; --fg:#eef0f3; --muted:#9aa1ab; --accent:#7fd1b9; --warn:#f2b66d; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display:flex; flex-direction:column; padding:16px; padding-bottom:max(16px, env(safe-area-inset-bottom)); }
  header { display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
  h1 { font-size:22px; margin:0; letter-spacing:.02em; }
  #memory, #timing { font-size:13px; color:var(--muted); }
  main { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; text-align:center; }
  #orb { width:160px; height:160px; border-radius:50%; background:#22262d; transition:transform .3s, background .3s; }
  body.listening #orb { background:#1f3a33; }
  body.speech #orb { transform:scale(1.08); background:#2a5b4d; }
  body.thinking #orb { background:#3a3322; }
  body.speaking #orb { background:var(--accent); }
  #status { font-size:20px; min-height:28px; }
  #hint, #last { font-size:14px; color:var(--muted); max-width:360px; }
  #last { min-height:40px; }
  button { font:inherit; border:0; border-radius:12px; padding:14px 18px; cursor:pointer; }
  #start { background:var(--accent); color:#0b1512; font-size:20px; font-weight:600; width:100%; max-width:360px; padding:20px; }
  footer { display:flex; gap:10px; justify-content:center; }
  footer button { background:#262a31; color:var(--fg); flex:1; max-width:170px; }
  .hidden { display:none !important; }
</style>
</head>
<body>
  <header><h1>Robbie</h1><span id="memory"></span></header>
  <main>
    <div id="orb"></div>
    <div id="status"></div>
    <div id="hint"></div>
    <div id="last"></div>
    <button id="start" class="hidden">Começar</button>
  </main>
  <div id="timing"></div>
  <footer id="controls" class="hidden">
    <button id="end">Encerrar</button>
  </footer>
  <script src="ort/ort.wasm.min.js"></script>
  <script src="vad/bundle.min.js"></script>
  <script src="app.js?v=3.10"></script>
</body>
</html>
