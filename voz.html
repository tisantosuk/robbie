<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Robbie: teste de voz</title>
<style>
  :root { --bg:#14161a; --fg:#eef0f3; --muted:#9aa1ab; --accent:#7fd1b9; }
  html, body { margin:0; background:var(--bg); color:var(--fg); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding:16px; }
  h1 { font-size:20px; margin:0 0 12px; }
  button { display:block; width:100%; max-width:420px; margin:10px 0; padding:16px; font:inherit; font-size:17px; border:0; border-radius:12px;
    background:#262a31; color:var(--fg); text-align:left; }
  #log { margin-top:16px; font-size:14px; color:var(--muted); white-space:pre-wrap; max-width:420px; }
</style>
</head>
<body>
  <h1>Teste da voz do celular</h1>
  <button id="t1">1. Falar (voz padrão)</button>
  <button id="t2">2. Falar (português do Brasil)</button>
  <button id="t3">3. Ligar o microfone e falar</button>
  <button id="t4">4. Ligar o som do Robbie e falar</button>
  <div id="log"></div>
<script>
'use strict';
// Diagnostic only (Robbie P-1): checks whether Chrome's speechSynthesis works on this phone, with and without the microphone
// or an AudioContext. Nothing is sent anywhere; results are only shown on this screen.
const log = (m) => { document.getElementById('log').textContent += new Date().toTimeString().slice(0, 8) + ' ' + m + '\n'; };
function speak(label, useBr) {
  const vs = speechSynthesis.getVoices();
  const u = new SpeechSynthesisUtterance('Teste ' + label + '. Oi Ti, aqui é a voz do celular.');
  if (useBr) {
    const v = vs.find((x) => /^pt[-_]BR/i.test(x.lang) && x.localService) || vs.find((x) => /^pt/i.test(x.lang));
    if (v) { u.voice = v; u.lang = v.lang; }
    log(label + ': voz ' + (v ? v.name + ' ' + v.lang + ' local=' + v.localService : 'nenhuma pt'));
  }
  u.onstart = () => log(label + ': começou a falar');
  u.onend = () => log(label + ': terminou');
  u.onerror = (e) => log(label + ': ERRO ' + e.error);
  log(label + ': pedindo para falar (vozes: ' + vs.length + ')');
  speechSynthesis.speak(u);
}
document.getElementById('t1').onclick = () => speak('1', false);
document.getElementById('t2').onclick = () => speak('2', true);
document.getElementById('t3').onclick = async () => {
  try {
    const s = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    log('3: microfone ligado');
    speak('3', true);
    setTimeout(() => { s.getTracks().forEach((t) => t.stop()); log('3: microfone desligado'); }, 8000);
  } catch (e) { log('3: microfone recusado: ' + e.message); }
};
document.getElementById('t4').onclick = async () => {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  await ctx.resume();
  log('4: som do Robbie ligado (' + ctx.state + ')');
  speak('4', true);
};
if (window.speechSynthesis) speechSynthesis.getVoices(); else log('Este navegador não tem leitura em voz alta.');
</script>
</body>
</html>
